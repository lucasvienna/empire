[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/lucasvienna/empire.git"
readme = "README.md"
publish = false

[package]
default-run = "empire"
name = "empire"
version.workspace = true
edition.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "empire"

[[bin]]
path = "src/bin/seed.rs"
name = "seed"

[dependencies]
anyhow = { workspace = true }
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["query", "macros", "tokio", "http2"] }
axum-extra = { version = "0.12.6", features = [
  "cookie",
  "tracing",
  "typed-header",
  "erased-json",
  "with-rejection",
] }
bigdecimal = { version = "0.4.10", features = ["std", "serde", "serde_json"] }
blake2 = "0.10.6"
chrono = { version = "0.4.45", features = ["serde"] }
config = { version = "0.15.25", default-features = false, features = [
  "yaml",
  "toml",
  "async",
] }
cookie = { version = "0.18.2", features = ["secure"] }
data-encoding = "2.11.1"
derive_more = { version = "2.1.1", features = ["deref", "display"] }
diesel = { version = "2.3.13", features = ["postgres", "extras"] }
diesel_migrations = "2.3.2"
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
http-body-util = "0.1.5"
logs-wheel = "0.3.1"
mime = "0.3.17"
r2d2 = "0.8.10"
rand = { version = "0.10.2", features = ["default", "serde"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-aux = "4.7.0"
serde_json = "1.0.151"
strum = "0.28.0"
strum_macros = "0.28.0"
tokio = { workspace = true }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower = { version = "0.5.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { version = "1.26.1", features = ["v4", "v7", "fast-rng", "macro-diagnostics", "serde"] }
unicode-segmentation = "1.13.3"
validator = "0.21.0"
ulid = { version = "3.0.0", features = ["serde", "uuid"] }

[dev-dependencies]
axum-test = "21.1.0"
claims = "0.8"
fake = "5.1"
quickcheck = "1.1.0"
quickcheck_macros = "1"
reqwest = { version = "0.13.5", features = ["json"] }

[workspace]
members = [".", "crates/rpc"]

[workspace.dependencies]
anyhow = "1.0.104"
empire = { path = "." }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
